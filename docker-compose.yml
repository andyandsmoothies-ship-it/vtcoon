services:
  vtcoon:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - WSS_PORT=3001
      - PORT=3000
      - GRACE_PERIOD_MS=60000
      - VTCOON_ADMIN_SECRET=${VTCOON_ADMIN_SECRET:-vtcoon_admin_secret_key_2026}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      vtcoon:
        condition: service_healthy
    networks:
      - internal
      - external

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http http://nginx:80 --url=${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      nginx:
        condition: service_started
    networks:
      - internal
      - external

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      nginx:
        condition: service_started
    networks:
      - internal
      - external
    profiles:
      - tunnel

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
