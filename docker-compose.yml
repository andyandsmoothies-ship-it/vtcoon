services:
  vtcoon:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - WSS_PORT=3001
      - PORT=3000
      - GRACE_PERIOD_MS=60000
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      vtcoon:
        condition: service_healthy
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
